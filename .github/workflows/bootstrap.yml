name: Bootstrap source

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Expand project source
        shell: bash
        run: |
          rm -rf /tmp/lavanderia-src
          mkdir -p /tmp/lavanderia-src
          cat bootstrap/part-* > /tmp/lavanderia-digital.tar.xz
          xz -t /tmp/lavanderia-digital.tar.xz
          tar -xJf /tmp/lavanderia-digital.tar.xz -C /tmp/lavanderia-src
          cp -a /tmp/lavanderia-src/lavanderia-digital/. .
          rm -rf bootstrap .github/workflows/bootstrap.yml

      - name: Commit source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publica código-fonte do projeto"
          git push origin HEAD:${{ github.head_ref }}
